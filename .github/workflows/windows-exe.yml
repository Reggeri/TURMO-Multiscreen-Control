name: Build TURMO Control Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  windows-exe:
    runs-on: windows-latest
    permissions:
      contents: read
    timeout-minutes: 30
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: x64

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Build embedded hardware sensor engine
        shell: pwsh
        run: |
          dotnet publish sensor_bridge/SensorBridge.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -p:PublishTrimmed=false -p:UseAppHost=true --output sensor_bridge/publish
          if (-not (Test-Path sensor_bridge/publish/SensorBridge.exe)) { throw "SensorBridge.exe not found" }

      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Package standalone Windows application
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --uac-admin --name TURMO-Control --collect-binaries imageio_ffmpeg --collect-submodules winrt.windows.foundation --collect-submodules winrt.windows.foundation.collections --collect-submodules winrt.windows.media.control --collect-submodules winrt.windows.storage.streams --add-data "nexus26_assets;nexus26_assets" --add-data "original_themes;original_themes" --add-data "music_visualizer_assets;music_visualizer_assets" --add-data "locales.json;." --add-binary "sensor_bridge/publish/SensorBridge.exe;." app.py
          if (-not (Test-Path dist/TURMO-Control.exe)) { throw "TURMO-Control.exe not found" }

      - name: Upload ready-to-run EXE
        uses: actions/upload-artifact@v4
        with:
          name: TURMO-Control-Windows-x64
          path: dist/TURMO-Control.exe
          if-no-files-found: error
          retention-days: 30
